name: Auto scan (all NSE stocks)
on:
  schedule:
    - cron: '0 3 * * 1-5'          # 08:30 IST — pre-open, on yesterday's close
    - cron: '25 3 * * 1-5'         # 08:55 IST — backup start (GitHub's cron can skip runs)
    - cron: '15,45 4-9 * * 1-5'    # 09:45 → 15:15 IST every 30 min — live session
    - cron: '15 10 * * 1-5'        # 15:45 IST — after the close
  workflow_dispatch:
    inputs:
      chained: {description: 'started by the previous run', required: false, default: ''}
permissions:
  contents: write
  actions: write
concurrency:
  group: morning-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: NSE stock list
        run: python3 tools/nse_symbols.py || true
      - name: Scan every NSE stock with the app's engine
        run: node tools/morning.js
      - name: Publish results
        run: |
          [ -f data/morning.json ] || exit 0
          git config user.name "daytrader-learner[bot]"; git config user.email "actions@users.noreply.github.com"
          git add data/morning.json data/scan_in.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto scan $(date -u +%F' '%H:%M) UTC [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*5)); done; exit 1
      - name: Keep the 30-minute cycle going and drive the other jobs (GitHub's own schedule is unreliable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); dow=$(TZ=Asia/Kolkata date +%u)
          [ "$dow" -le 5 ] || exit 0
          if [ "$now" -ge 0900 ] && [ "$now" -lt 1540 ]; then gh workflow run flows.yml --ref main || true; fi
          if [ "$now" -ge 1530 ] && [ "$now" -lt 1800 ]; then gh workflow run flows.yml --ref main || true; gh workflow run paper.yml --ref main || true; exit 0; fi
          if [ "$now" -ge 0800 ] && [ "$now" -lt 1530 ]; then sleep 1500; gh workflow run morning.yml --ref main -f chained=1; fi
