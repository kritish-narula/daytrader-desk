name: Build Android APK
on:
  push: {branches: [main]}
  workflow_dispatch: {}
  schedule: [{cron: '17 2 * * 0'}]   # every Sunday ~07:47 IST: retrain the model on fresh data
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Download NSE stock list and F&O lot sizes
        run: python3 tools/nse_symbols.py
      - name: Download US stock list (Nasdaq Trader) and S&P 500/400/600 sectors
        run: python3 tools/us_symbols.py
      - name: Live data smoke test
        continue-on-error: true
        run: node tools/livetest.js
      - name: Self-learning — retrain weights, score bands and setup stats (champion/challenger)
        continue-on-error: true
        timeout-minutes: 20
        run: node tools/learn.js
      - name: Save the learned model to the repo (the app fetches it weekly)
        continue-on-error: true
        run: |
          if [ -f www/model.json ] && ! git diff --quiet --exit-code -- www/model.json 2>/dev/null || [ -n "$(git status --porcelain www/model.json)" ]; then
            git config user.name "daytrader-learner[bot]"; git config user.email "actions@users.noreply.github.com"
            git add www/model.json && git commit -m "Model update: $(node -e "const m=require('./www/model.json');console.log('v'+m.v+' '+m.date)") [skip ci]" && git push
          fi
      - name: Permanent signing key (encrypted with the KS_PASS secret; created once, reused forever)
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "No KS_PASS secret: debug-signed build (updates need a reinstall)"; echo '{"signed":false}' > /tmp/sign.json; exit 0; fi
          if [ -f native/release.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in native/release.keystore.enc -out /tmp/release.keystore -pass env:KS_PASS || { echo "::error::KS_PASS does not match the stored signing key"; exit 1; }
          else
            keytool -genkeypair -keystore /tmp/release.keystore -storetype PKCS12 -alias dtd -keyalg RSA -keysize 4096 -validity 36500 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=DayTrader Desk, O=Personal"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/release.keystore -out native/release.keystore.enc -pass env:KS_PASS
            git config user.name "daytrader-learner[bot]"; git config user.email "actions@users.noreply.github.com"
            git add native/release.keystore.enc && git commit -m "Add encrypted app signing key [skip ci]"
            git pull --rebase origin main && git push   # must succeed, or the next build would get a different key
          fi
          echo "KS_FILE=/tmp/release.keystore" >> $GITHUB_ENV
          echo '{"signed":true}' > /tmp/sign.json
      - name: Build web assets
        run: |
          python3 build.py && rm www/desk_template.html www/tsla.json
          node -e "const s=require('/tmp/sign.json');require('fs').writeFileSync('www/version.json',JSON.stringify({build:+process.env.GITHUB_RUN_NUMBER,signed:s.signed,date:new Date().toISOString().slice(0,10)}))"
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7
          npx cap add android
          npx cap sync android
          python3 native/patch_android.py
          cd android && chmod +x gradlew
          if [ -n "$KS_FILE" ]; then
            cp "$KS_FILE" app/release.keystore
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../DayTraderDesk.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../DayTraderDesk.apk
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DayTrader Desk build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'Weekly model retrain' }}

            Install DayTraderDesk.apk on Android (or tap Update inside the app).
          files: DayTraderDesk.apk
